name: Release

# Ein Release veröffentlicht nur nach bestandenen Gates auf exakt dem
# getaggten Commit: Der Web-Gate-Job blockiert die Publish-Jobs (needs),
# und jeder Release-Job führt cargo check auf demselben Stand aus. Sich
# stattdessen auf den CI-Lauf auf main zu verlassen, wäre löchrig — er
# kann fehlen oder noch laufen, und ein Tag darf auf beliebig alten
# Commits zeigen. Die Web-Gates deshalb bewusst hier erneut ausführen,
# geteilt über .github/actions/web-gates.
#
# Desktop-Matrix: Windows (NSIS), macOS (.app/.dmg) und Linux (AppImage/deb)
# bauen parallel und hängen an denselben GitHub-Release — appendReleases
# verhindert, dass der zweite Lauf den Release überschreibt, und führt die
# Updater-JSON (latest.json) zusammen. Ubuntu 22.04 bewusst statt latest:
# die ältere glibc hält die AppImage auch auf älteren Distributionen lauffähig.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  web-gates:
    name: Gates (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/web-gates

  release:
    name: Release (${{ matrix.label }})
    needs: web-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Systemabhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: cargo check (Rust-Gate auf dem getaggten Commit)
        working-directory: src-tauri
        run: cargo check --locked

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Bauen und Release veröffentlichen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ashen Crown ${{ github.ref_name }}'
          releaseBody: 'Siehe [CHANGELOG.md](https://github.com/Trobikus/ashen-crown/blob/main/CHANGELOG.md) für die Änderungen dieser Version.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          appendReleases: true
