name: Release

# Ein Release veröffentlicht nur nach bestandenen Gates auf exakt dem
# getaggten Commit: Der Web-Gate-Job blockiert den Publish-Job (needs),
# und der Release-Job führt cargo check auf demselben Stand aus. Sich
# stattdessen auf den CI-Lauf auf main zu verlassen, wäre löchrig — er
# kann fehlen oder noch laufen, und ein Tag darf auf beliebig alten
# Commits zeigen. Die Web-Gates deshalb bewusst hier erneut ausführen,
# geteilt über .github/actions/web-gates.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  web-gates:
    name: Gates (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/web-gates

  release:
    name: Release (Windows)
    needs: web-gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check (Rust-Gate auf dem getaggten Commit)
        working-directory: src-tauri
        run: cargo check --locked

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Bauen und Release veröffentlichen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ashen Crown ${{ github.ref_name }}'
          releaseBody: 'Siehe [CHANGELOG.md](https://github.com/Trobikus/ashen-crown/blob/main/CHANGELOG.md) für die Änderungen dieser Version.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
