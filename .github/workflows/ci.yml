name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Build (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Die Web-Gates leben in der Composite-Action — derselbe Satz läuft
      # im Release-Workflow vor jedem Publish (.github/actions/web-gates).
      - uses: ./.github/actions/web-gates

  rust:
    name: Check (Tauri/Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked
