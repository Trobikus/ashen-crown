name: GitHub Pages

# Das Spiel als Web-Build auf GitHub Pages: jeder Stand auf main und
# manuelle Läufe aktualisieren die Seite. Keine Tag-Trigger — die
# github-pages-Umgebung erlaubt nur Deployments aus main, und Releases
# werden ohnehin von main getaggt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Web-Build veröffentlichen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Web-Build bauen
        run: pnpm build

      - name: Seiten-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
