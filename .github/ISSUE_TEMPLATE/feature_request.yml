name: Idea / suggestion
description: What would you like to see in Ashen Crown?
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should happen, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it fit the game?
      description: Short sanity check — tone, balance, effort.
