name: Bug report
description: Something isn't working? Help me reproduce it.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop (Tauri)
        - Web (browser)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the game
        2. …
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshots
      description: If helpful — pictures say more than words.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Save file involved? Console (F12) output? Browser/OS?
